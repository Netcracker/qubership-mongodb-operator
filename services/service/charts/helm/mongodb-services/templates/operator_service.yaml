kind: Service
apiVersion: v1
metadata:
  name: {{ .Values.operator.operatorName }}
  labels:
    name: {{ .Values.operator.operatorName }}
    app.kubernetes.io/name: {{ .Values.operator.operatorName }}
    app.kubernetes.io/managed-by: "operator"
    app.kubernetes.io/managed-by-operator: "mongodb-services-operator"
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8069
      targetPort: 8069
  selector:
    name: {{ .Values.operator.operatorName }}
  type: ClusterIP
