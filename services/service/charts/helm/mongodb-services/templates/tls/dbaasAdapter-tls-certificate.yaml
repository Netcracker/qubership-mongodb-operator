{{- if and (.Values.dbaas.install) (and (ne .Values.tls.mode "disabled") .Values.tls.generateCerts.enabled) }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dbaas-tls-certificate
spec:
  secretName: {{ .Values.dbaas.tls.dbaasAdapterCASecretName }}
  duration: {{ default 365 .Values.dbaas.tls.duration | mul 24 }}h
  commonName: dbaas-certificate-cn
  usages:
    - digital signature
    - key encipherment
    - server auth
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  dnsNames:
{{ ( include "dbaasAdapter.certDnsNames" . | indent 4 ) }}
  ipAddresses:
{{ ( include "common.certIpAddresses" . | indent 4) }}
  issuerRef:
    group: cert-manager.io
  {{- if .Values.tls.generateCerts.clusterIssuerName }}
    name: {{ .Values.tls.generateCerts.clusterIssuerName }}
    kind: ClusterIssuer
  {{- else }}
    name: mongodb-tls-issuer
    kind: Issuer
  {{- end }}
{{- end }}