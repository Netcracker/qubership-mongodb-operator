{{- if and (ne .Values.tls.mode "disabled") .Values.tls.generateCerts.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: backup-daemon-tls-certificate
spec:
  secretName: {{ .Values.backup.tls.backupDaemonCASecretName }}
  duration: {{ default 365 .Values.backup.tls.duration | mul 24 }}h
  commonName: backup-daemon-certificate-cn
  isCA: true
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  dnsNames:
{{ ( include "backupDaemon.certDnsNames" . | indent 4 ) }}
  ipAddresses:
{{ ( include "common.certIpAddresses" . | indent 4) }}
  issuerRef:
    group: cert-manager.io
  {{- if .Values.tls.generateCerts.clusterIssuerName }}
    name: {{ .Values.tls.generateCerts.clusterIssuerName }}
    kind: ClusterIssuer
  {{- else }}
    name: mongodb-tls-issuer
    kind: Issuer
  {{- end }}
{{- end }}