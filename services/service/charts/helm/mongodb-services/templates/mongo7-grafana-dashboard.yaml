{{- if eq (include "fromValuesThenEnvElseDefault" (dict "dotVar" .Values.prometheusExporter.install "envVar" .Values.MONITORING_ENABLED "default" true )) "true" }}
apiVersion: integreatly.org/v1alpha1
kind: GrafanaDashboard
metadata:
  annotations: null
  name: mongodb7-{{ .Release.Namespace }}.json
  labels:
    app: grafana
  annotations:
spec:
  gzipJson: {{ .Files.Get "monitoring/mongo7-grafana-dashboard.json.gz" | b64enc | quote }}
{{ end }}
