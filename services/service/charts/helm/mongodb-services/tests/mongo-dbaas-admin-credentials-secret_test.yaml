suite: Test Mongo Dbaas Admin credentials secret
templates:
  - secrets/mongo-dbaas-admin-credentials-secret.yaml
tests:
  - it: should render secret from default values
    asserts:
      - equal:
          path: stringData.username
          value: "dbaas"
      - equal:
          path: stringData.password
          value: "dbaas"
  - it: should render secret with vault
    set:
      vaultRegistration:
        enabled: true
      CLOUD_PUBLIC_HOST: test.example.com
    asserts:
      - equal:
          path: stringData.username
          value: "dbaas"
      - equal:
          path: stringData.password
          value: "vault:database/static-creds/nc-test.example.com_NAMESPACE_mongodb-services-operator_dbaas#password"