suite: Test Backup API credentials secret
templates:
  - secrets/mongodb-backup-api-credentials.yaml
tests:
  - it: should render secret from default values
    asserts:
      - equal:
          path: stringData.username
          value: "backup"
      - equal:
          path: stringData.password
          value: "backup"
  - it: should render secret with vault
    set:
      vaultRegistration:
        enabled: true
      CLOUD_PUBLIC_HOST: test.example.com
    asserts:
      - equal:
          path: stringData.username
          value: "backup"
      - equal:
          path: stringData.password
          value: "vault:secret/nc-test.example.com/NAMESPACE/mongodb-services-operator/mongodb-backup-api-credentials.v1#password"