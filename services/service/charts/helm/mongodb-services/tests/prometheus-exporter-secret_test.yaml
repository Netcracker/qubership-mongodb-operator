suite: Test Cloud Passport templating
templates:
  - secrets/prometheus-exporter-secret.yaml
tests:
  - it: should render secret from default values
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: Secret
          name: mongodb-prom-exporter-credentials.v1
  - it: should render secret from values ignoring env vars
    documentIndex: 0
    set:
      MONITORING_ENABLED: false
      prometheusExporter:
        install: true
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: Secret
          name: mongodb-prom-exporter-credentials.v1
  - it: should render secret from env var
    documentIndex: 0
    set:
      MONITORING_ENABLED: true
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: Secret
          name: mongodb-prom-exporter-credentials.v1