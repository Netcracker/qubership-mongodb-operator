---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - netcracker.com
  resources:
  - mongodbsupplservices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - netcracker.com
  resources:
  - mongodbsupplservices/finalizers
  verbs:
  - update
- apiGroups:
  - netcracker.com
  resources:
  - mongodbsupplservices/status
  verbs:
  - get
  - patch
  - update
