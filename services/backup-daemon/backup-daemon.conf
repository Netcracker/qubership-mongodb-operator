{
    instances_key = "-d"
    map_key = "-m"
    command = "/opt/mongodb-backup/scripts.sh backup -f {{.data_folder}} {{.dbs}}"
    incremental_command = /opt/mongodb-backup/scripts.sh inc-backup -f "%(data_folder)s" "%(start_ts)s"
    restore_command = "/opt/mongodb-backup/scripts.sh restore -f {{.data_folder}} {{.dbs}} {{.dbmap}}"
    incremental_restore_command = /opt/mongodb-backup/scripts.sh inc-restore -f "%(data_folder)s"
    list_instances_in_vault_command = "/opt/mongodb-backup/scripts.sh list-dbs -f {{.data_folder}}"
    incremental_list_instances_in_vault_command = /opt/mongodb-backup/scripts.sh list-dbs -f "%(data_folder)s"
    tls_enabled = ${?INTERNAL_TLS_ENABLED}
    certs_path = ${?INTERNAL_TLS_PATH}
    custom_vars = [
      start_ts
    ]
    must_have_env_vars = [
      MONGO_AUTH_DB,
      MONGO_BACKUP_DB,
      MONGO_SOURCE_DB,
      CONFIG_NODES
    ]
}
