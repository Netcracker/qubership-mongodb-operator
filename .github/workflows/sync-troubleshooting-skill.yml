name: Sync Troubleshooting Skill
run-name: "Sync troubleshooting skill #${{ github.run_number }} — triggered by ${{ github.actor }} (${{ github.event_name }})"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      auto-merge:
        description: "Automatically enable auto-merge for the created pull request"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Sync troubleshooting doc into skill
        uses: netcracker/qubership-workflow-hub/actions/sync-files-action@e6afd0a6bcc4f24d73e3e4d5fb9a31ada009e3f1  # v2.8.2
        with:
          files: |
            [
              { "from": "docs/public/troubleshooting.md", "to": "agent-packages/troubleshoot-mongodb/.apm/skills/troubleshoot-mongodb/references/troubleshooting.md" }
            ]
          title: "chore: sync troubleshooting skill reference"
          commit-message: "chore: sync troubleshooting skill reference"
          auto-merge: ${{ inputs.auto-merge || 'true' }}
          token: ${{ secrets.GITHUB_TOKEN }}