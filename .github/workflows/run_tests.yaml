name: Run MongoDB Pipeline

permissions:
  contents: read
  packages: read
  actions: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

jobs:

  Wait-for-images:
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.check.outputs.skip_tests }}
    steps:
      - name: Check if build.yaml was triggered for this commit
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SHA="${{ github.event.pull_request.head.sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          RUNS=$(gh run list --workflow build.yaml --repo ${{ github.repository }} --commit $SHA)
          SKIP_TESTS="false"
          if [ -z "$RUNS" ]; then
            SKIP_TESTS="true"
          fi
          echo SKIP_TESTS: $SKIP_TESTS
          echo "skip_tests=$SKIP_TESTS" >> $GITHUB_OUTPUT
      - name: Wait for push.yml to complete
        if: steps.check.outputs.skip_tests == 'false'
        uses: netcracker/qubership-workflow-hub/actions/wait-for-workflow@cf536587a99a23b3614aa4db4bdbf13cf36059b6  # v2.8.3
        id: wait
        with:
          workflow: build.yaml
          token: ${{ secrets.GITHUB_TOKEN }}
          poll-interval: 20

  MongoDB-Pipeline:
    needs: Wait-for-images
    uses: Netcracker/qubership-test-pipelines/.github/workflows/mongodb.yaml@4ebc866a2ca5e308d2fad2e91de81a0aa6d42ba5 # v1.19.1
    with:
      repository_name: ${{ github.repository }}
      service_branch: '${{ github.head_ref || github.ref_name }}'
      pipeline_branch: '4ebc866a2ca5e308d2fad2e91de81a0aa6d42ba5' # v1.19.1 renovate: depName=Netcracker/qubership-test-pipelines
      skip_tests: ${{ fromJSON(needs.Wait-for-images.outputs.skip_tests) }}
      # ubuntu-22.04 (kernel 6.8): MongoDB 8.0 refuses to start on kernel 6.19+, and both ubuntu-24.04 and ubuntu-26.04 runners ship 7.0.0-azure, see SERVER-136848
      runner_type: 'ubuntu-22.04'
    secrets:
      AWS_S3_ACCESS_KEY_ID: ${{secrets.AWS_S3_ACCESS_KEY_ID}}
      AWS_S3_ACCESS_KEY_SECRET: ${{secrets.AWS_S3_ACCESS_KEY_SECRET}}
  Renovate-Approve:
    needs: MongoDB-Pipeline
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/renovate-approve.yaml
