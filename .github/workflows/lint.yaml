name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Cache Go modules
        uses: actions/cache@d4323d4df104b0265ee61511aaeda5526965f660 # v4
        with:
          path: .go/pkg/mod
          key: go-mod-cache-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-cache-${{ runner.os }}-

      - name: Run common linter
        run: |
          docker run --rm \
            -e RUN_LOCAL=true \
            -e VALIDATE_ALL_CODEBASE=false \
            -e DEFAULT_BRANCH=main \
            -e FILTER_REGEX_EXCLUDE='^\.go/pkg/mod/.*' \
            -e SKILLCHECK_PATTERNS='agent-packages/*/.apm/skills' \
            -v "$GITHUB_WORKSPACE:/tmp/lint" \
            ghcr.io/netcracker/linter:common_linter_integration
