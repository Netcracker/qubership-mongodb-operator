name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Cache Go modules
        uses: actions/cache@d4323d4df104b0265ee61511aaeda5526965f660 # v4
        with:
          path: .go/pkg/mod
          key: go-mod-cache-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-cache-${{ runner.os }}-

      - name: Run unit tests
        run: |
          docker run --rm \
            -e CI=true \
            -e DEFAULT_BRANCH=main \
            -v "$GITHUB_WORKSPACE:/tmp/lint" \
            -w /tmp/lint \
            --entrypoint "" \
            ghcr.io/netcracker/linter:common_linter_integration \
            make test
