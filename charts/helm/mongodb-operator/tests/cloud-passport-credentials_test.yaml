suite: Test Cloud Passport credentials templating
templates:
- secrets/mongodb-root-credentials.yaml
- secrets/dbaas-aggregator-registration-credentials.yaml
tests:
- it: should render secrets using default values
  template: secrets/mongodb-root-credentials.yaml
  asserts:
  - equal:
      path: stringData.username
      value: "root"
  - equal:
      path: stringData.password
      value: "root"
- it: should render secrets using Cloud Passport Values
  template: secrets/mongodb-root-credentials.yaml
  set:
    INFRA_MONGO_DB_USERNAME: root_user
    INFRA_MONGO_DB_PASSWORD: root_pass
  asserts:
  - equal:
      path: stringData.username
      value: "root_user"
  - equal:
      path: stringData.password
      value: "root_pass"
