kind: Service
apiVersion: v1
metadata:
  name: mongodb-operator
  labels:
    name: mongodb-operator
    app.kubernetes.io/name: mongodb-operator
    app.kubernetes.io/managed-by: operator
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8069
      targetPort: 8069
  selector:
    name: {{ .Values.operator.operatorName }}
  type: ClusterIP
