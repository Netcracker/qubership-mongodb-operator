{{- if (.Values.mongodb.install) }}
{{ $params := dict "isInternal" true}}
{{ $params = set $params "secret" (dict "secretName" .Values.mongodb.mongoRootSecretName "username" .Values.mongodb.rootUser "password" .Values.mongodb.rootPassword "role" .Values.mongodb.rootUserRole) }}
{{ $params = set $params "cloudPublicHost" .Values.CLOUD_PUBLIC_HOST }}
{{ $params = set $params "namespace" .Release.Namespace }}
{{ $params = set $params "serviceAccount" .Values.operator.operatorName }}
{{ $params = set $params "userEnv" .Values.INFRA_MONGO_DB_USERNAME }}
{{ $params = set $params "passEnv" .Values.INFRA_MONGO_DB_PASSWORD }}
{{template "nosql.core.secret.fromEnv" $params }}
{{ end }}